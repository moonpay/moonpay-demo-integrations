<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7814f5">
    <meta name="description" content="MoonPay Off-Ramp - Web SDK Demo">
    <title>MoonPay Off-Ramp - Web SDK</title>
</head>
<body>
    <main>
        <h1>MoonPay Off-Ramp Integration - Web SDK</h1>
        <button id="startTransaction" type="button">Sell Crypto</button>
        <!-- Errors are rendered here as well as logged, so a failed signing
             round-trip is visible without opening devtools. aria-live makes the
             update audible to screen readers. -->
        <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="./index.js"></script>
</body>
</html>
